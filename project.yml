# Décrit le projet Xcode. GitHub le transforme en vrai projet avec XcodeGen.
name: CompteurLieux
options:
  bundleIdPrefix: com.compteurlieux
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CompteurLieux:
    type: application
    platform: iOS
    sources:
      - CompteurLieux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.compteurlieux.app
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CompteurLieux-Info.plist
      properties:
        CFBundleDisplayName: Lieux
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Pour savoir quand tu arrives dans un de tes lieux."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Pour compter le temps passé dans tes lieux même quand l'app est fermée."
